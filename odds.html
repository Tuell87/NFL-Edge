<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>NFL Edge | FanDuel Odds</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark;background:#0b1220;color:#eaf4ff}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
main{max-width:880px;margin:auto;padding:16px 12px 40px}
a{color:#54e6b5}
h1{font-size:clamp(1.4rem,5vw,1.9rem);margin:.6em 0 .3em}
p{margin:.5em 0}
.muted,small{color:#a9bfd4}
small{display:block}
.warn{color:#ffd68e}
.filters,.pagination{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
label{display:grid;flex:1;gap:4px;font-size:.85rem;min-width:140px}
input,select,button{background:#16263a;border:1px solid #53687e;color:inherit;border-radius:8px;padding:8px;font:inherit;font-size:16px;min-height:44px;width:100%}
button{width:auto;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid #54e6b5;outline-offset:2px}
table{width:100%;border-collapse:collapse;font-size:.875rem}
th,td{text-align:left;padding:8px 5px;border-bottom:1px solid #324760;overflow-wrap:anywhere}
th:last-child,td:last-child{text-align:right}
.price{color:#54e6b5;font-weight:700}
.search-picker{min-width:0}.search-picker [hidden]{display:none}.search-picker select{width:100%;min-height:44px;font-size:16px}
@media(max-width:520px){.toolbar .search-picker{grid-column:1/-1}}
</style>
<link rel="stylesheet" href="./mobile-navigation.css">
</head>
<body>
<nav class="mobile-sections" aria-label="Main site sections">
  <a href="./#games">Games</a>
  <a href="./#players">Players</a>
  <a href="./#odds" aria-current="true">Odds &amp; Tools</a>
  <a href="./#research">Research</a>
  <a href="./#project">Project</a>
  <a href="./#rewards">Rewards</a>
</nav>

<main>
<a href="./#odds">← Odds &amp; Calculators</a>
<h1>FanDuel player odds</h1>
<p class="muted">Published snapshots via The Odds API for up to two upcoming games. Check FanDuel for current prices.</p>
<p id="status" role="status">Loading published odds…</p>
<p id="updated" class="muted"></p>
<div class="filters">
<div class="search-picker">
<label for="search-choice">Player or matchup</label>
<select id="search-choice" data-default-label="All players and matchups">
  <option value="">All players and matchups</option>
  <option value="custom">Custom search…</option>
</select>
<input id="search" type="search" aria-label="Custom search" placeholder="Player or matchup…" hidden>
</div>
<label>Market<select id="market"><option value="">All markets</option></select></label>
<button id="refresh" type="button">Refresh snapshot</button>
</div>
<p id="results" role="status"></p>
<table id="board" aria-label="FanDuel player odds snapshot" hidden>
<thead><tr><th scope="col">Player / game</th><th scope="col">Market / selection</th><th scope="col">Price<small>Bookmaker update</small></th></tr></thead>
<tbody id="list"></tbody>
</table>
<div id="pagination" class="pagination" role="group" aria-label="Odds results pages" hidden>
<button id="previous" type="button">Previous</button>
<button id="next" type="button">Next</button>
</div>
</main>
<script src="./search-choices.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const marketLabels = {
  player_anytime_td: 'Anytime TD',
  player_reception_yds: 'Receiving yards',
  player_rush_yds: 'Rushing yards',
};
const pageSize = 20;
let rows = [];
let page = 0;
const marketLabel = key => marketLabels[key] || key || 'Unknown market';

function timeLabel(value) {
  const time = Date.parse(value);
  return Number.isFinite(time) ? new Date(time).toLocaleString() : 'Time unavailable';
}

function oddsRow(x, now) {
  const row = document.createElement('tr');
  const player = row.insertCell();
  player.textContent = x.player || 'Player unavailable';
  const game = document.createElement('small');
  game.textContent = x.event || 'Matchup unavailable';
  player.append(game);
  const start = Date.parse(x.commence_time);
  if (Number.isFinite(start) && start <= now) {
    const ended = document.createElement('small');
    ended.className = 'warn';
    ended.textContent = 'Game started';
    player.append(ended);
  }
  const selection = row.insertCell();
  selection.textContent = marketLabel(x.market);
  const line = document.createElement('small');
  line.textContent = [x.side, x.line].filter(value => value != null && value !== '').join(' ');
  selection.append(line);
  const price = row.insertCell();
  price.className = 'price';
  price.textContent = (x.odds > 0 ? '+' : '') + x.odds;
  const updated = document.createElement('small');
  updated.textContent = timeLabel(x.bookmaker_updated);
  price.append(updated);
  return row;
}

function render() {
  const query = $('search').value.trim().toLowerCase();
  const market = $('market').value;
  const filtered = rows.filter(row => (!market || row.market === market) &&
    [row.player, row.event].some(value => String(value || '').toLowerCase().includes(query)));
  const lastPage = Math.max(0, Math.ceil(filtered.length / pageSize) - 1);
  page = Math.min(lastPage, Math.max(page, 0));
  const start = page * pageSize;
  const visible = filtered.slice(start, start + pageSize);
  const now = Date.now();
  $('list').replaceChildren(...visible.map(row => oddsRow(row, now)));
  $('board').hidden = !visible.length;
  $('pagination').hidden = !lastPage;
  $('previous').disabled = page === 0;
  $('next').disabled = page === lastPage;
  $('results').textContent = visible.length
    ? `Showing ${start + 1}–${start + visible.length} of ${filtered.length} selections`
    : rows.length ? 'No selections match your filters.' : '';
}

function updateMarkets() {
  const select = $('market');
  const selected = select.value;
  const markets = [...new Set(rows.map(row => row.market).filter(Boolean))];
  markets.sort((a, b) => marketLabel(a).localeCompare(marketLabel(b)));
  select.replaceChildren(new Option('All markets', ''),
    ...markets.map(key => new Option(marketLabel(key), key)));
  select.value = markets.includes(selected) ? selected : '';
}

async function load() {
  const refresh = $('refresh');
  const status = $('status');
  refresh.disabled = true;
  status.textContent = 'Loading published odds…';
  try {
    const response = await fetch('./data/odds.json', {cache: 'no-store'});
    if (!response.ok) throw new Error('Snapshot unavailable');
    const body = await response.json();
    rows = Array.isArray(body.markets) ? body.markets.filter(row => row && Number.isFinite(row.odds)) : [];
    $('updated').textContent = 'Feed checked: ' + timeLabel(body.updated_at);
    const messages = {
      ok: rows.length ? 'Snapshot loaded' : 'The snapshot contains no usable prices.',
      not_configured: 'The odds feed is not connected yet.',
      no_markets: 'FanDuel returned no props for the games checked.',
    };
    status.textContent = messages[body.status] || 'The odds feed is currently unavailable.';
    if (body.status === 'ok' && Number.isInteger(body.events_failed) && body.events_failed > 0) {
      status.textContent += ' Some game prices could not be loaded.';
    }
  } catch {
    rows = [];
    $('updated').textContent = '';
    status.textContent = 'The published snapshot could not be loaded. Try refreshing.';
  } finally {
    if ($('search-choice')) updateSearchChoices(rows, ["player","event"]);
    updateMarkets();
    render();
    refresh.disabled = false;
  }
}

function resetPage() {
  page = 0;
  render();
}

$('search').addEventListener('input', resetPage);
$('market').addEventListener('change', resetPage);
$('previous').addEventListener('click', () => { page--; render(); });
$('next').addEventListener('click', () => { page++; render(); });
$('refresh').addEventListener('click', load);
if ($('search-choice')) updateSearchChoices([], ["player","event"]);
load();
</script>
</body>
</html>
