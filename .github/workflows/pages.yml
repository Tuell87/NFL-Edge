name: Test and deploy NFL Edge
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: read
concurrency:
  group: nfl-edge-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static release checks
        run: python3 scripts/check_release.py
      - name: Odds collector offline tests
        run: python3 -m unittest discover -s tests -p "test_odds*.py"
      - name: UI smoke tests
        run: node --test tests/*.test.cjs
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect FanDuel odds using server-side secret
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 scripts/fetch_odds.py
      - name: Publish only approved static files
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp workbench.html _site/workbench.html
          cp market.html _site/market.html
          cp odds.html _site/odds.html
          mkdir -p _site/data
          cp data/odds.json _site/data/odds.json
          cp 404.html _site/404.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
