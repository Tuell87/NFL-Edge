name: Test and deploy NFL Edge
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: read
concurrency:
  group: nfl-edge-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static release checks
        run: python3 scripts/check_release.py
      - name: Odds collector offline tests
        run: python3 -m unittest discover -s tests -p "test_*.py"
      - name: UI smoke tests
        run: node --test tests/*.test.cjs
      - name: Compile all Python scripts
        run: python3 -m compileall -q scripts tests
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect FanDuel odds using server-side secret
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 scripts/fetch_odds.py
      - name: Collect free NFL scoreboard
        run: python3 scripts/fetch_games.py
      - name: Collect free NFL player box scores
        run: python3 scripts/fetch_players.py
      - name: Compute daily history cache key
        id: history_day
        run: echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Restore unmerged daily historical NFL sample
        id: history_cache
        uses: actions/cache/restore@v4
        with:
          path: data/history.json
          key: nfl-history-v6-unmerged-${{ steps.history_day.outputs.day }}
      - name: Collect historical NFL player results
        if: steps.history_cache.outputs.cache-hit != 'true'
        run: python3 scripts/fetch_history.py
      - name: Cache only the raw, unmerged daily historical sample
        if: steps.history_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/history.json
          key: nfl-history-v6-unmerged-${{ steps.history_day.outputs.day }}
      - name: Restore cached 2025 NFL season archive
        id: archive_cache
        uses: actions/cache/restore@v4
        with:
          path: data/archive_2025.json
          key: nfl-season-2025-archive-v2-verified
      - name: Collect 2025 season archive when not cached
        if: steps.archive_cache.outputs.cache-hit != 'true'
        run: python3 scripts/fetch_season_archive.py
      - name: Check whether season archive is cacheable
        id: archive_quality
        if: steps.archive_cache.outputs.cache-hit != 'true'
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          try:
              data = json.loads(Path("data/archive_2025.json").read_text())
              import importlib.util
              spec = importlib.util.spec_from_file_location("archive_check", "scripts/check_season_archive.py")
              checker = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(checker)
              valid = checker.inspect(data)["cacheable"]
          except (OSError, ValueError, TypeError):
              valid = False
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"cacheable={str(valid).lower()}\n")
          PY
      - name: Cache usable 2025 archive for future deployments
        if: steps.archive_cache.outputs.cache-hit != 'true' && steps.archive_quality.outputs.cacheable == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/archive_2025.json
          key: nfl-season-2025-archive-v1
      - name: Restore cached 2024 NFL season archive
        id: archive_2024_cache
        uses: actions/cache/restore@v4
        with:
          path: data/archive_2024.json
          key: nfl-season-2024-archive-v1-verified
      - name: Collect 2024 season archive when not cached
        if: steps.archive_2024_cache.outputs.cache-hit != 'true'
        run: python3 scripts/fetch_archive_2024.py
      - name: Check whether 2024 season archive is cacheable
        id: archive_2024_quality
        if: steps.archive_2024_cache.outputs.cache-hit != 'true'
        run: |
          python3 - <<'PY'
          import json
          import os
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("archive_check", "scripts/check_season_archive.py")
          checker = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(checker)
          try:
              data = json.loads(Path("data/archive_2024.json").read_text())
              valid = checker.inspect(data, expected_season=2024)["cacheable"]
          except (OSError, ValueError, TypeError):
              valid = False
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"cacheable={str(valid).lower()}\n")
          PY
      - name: Cache usable 2024 archive for future deployments
        if: steps.archive_2024_cache.outputs.cache-hit != 'true' && steps.archive_2024_quality.outputs.cacheable == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/archive_2024.json
          key: nfl-season-2024-archive-v1-verified
      - name: Merge complete 2024 and 2025 games with current history
        run: python3 scripts/merge_season_archive.py
      - name: Measure historical data completeness
        run: python3 scripts/build_history_quality.py
      - name: Evaluate historical over-probability estimates
        run: python3 scripts/evaluate_probabilities.py
      - name: Evaluate out-of-time probability holdout
        run: python3 scripts/evaluate_holdout.py
      - name: Evaluate leakage-safe opponent context adjustments
        run: python3 scripts/evaluate_opponent.py
      - name: Evaluate out-of-time opponent adjustment holdout
        run: python3 scripts/evaluate_opponent_holdout.py
      - name: Evaluate three rolling opponent-model validation windows
        run: python3 scripts/evaluate_opponent_rolling.py
      - name: Evaluate frozen pre-season opponent model on later NFL seasons
        run: python3 scripts/evaluate_opponent_seasons.py
      - name: Build descriptive historical yardage baseline
        run: python3 scripts/build_baseline.py
      - name: Evaluate chronological yardage baseline
        run: python3 scripts/evaluate_baseline.py
      - name: Collect free NFL team roster identity snapshots
        run: python3 scripts/fetch_rosters.py
      - name: Pair historical players to upcoming NFL opponents
        run: python3 scripts/build_matchups.py
      - name: Summarize roster feed and matchup identity coverage
        run: python3 scripts/build_roster_quality.py
      - name: Audit cross-feed identities and data freshness
        run: python3 scripts/build_feed_integrity.py
      - name: Audit experimental probabilities against current FanDuel lines
        run: python3 scripts/build_market_audit.py
      - name: Summarize current model research readiness for mobile homepage
        run: python3 scripts/build_research_status.py
      - name: Verify generated JSON contracts before publishing
        run: python3 scripts/check_data_contracts.py
      - name: Verify generated health and prediction safety
        run: python3 scripts/check_generated_health.py
      - name: Publish only approved static files
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp legacy-demo.html _site/legacy-demo.html
          cp workbench.html _site/workbench.html
          cp market.html _site/market.html
          cp odds.html _site/odds.html
          cp home-next.html _site/home-next.html
          cp players.html _site/players.html
          cp history.html _site/history.html
          cp compare.html _site/compare.html
          cp evaluation.html _site/evaluation.html
          cp probabilities.html _site/probabilities.html
          cp matchups.html _site/matchups.html
          cp market-audit.html _site/market-audit.html
          cp holdout.html _site/holdout.html
          cp opponent-evaluation.html _site/opponent-evaluation.html
          cp opponent-holdout.html _site/opponent-holdout.html
          cp opponent-rolling.html _site/opponent-rolling.html
          cp opponent-seasons.html _site/opponent-seasons.html
          cp history-quality.html _site/history-quality.html
          cp roster-quality.html _site/roster-quality.html
          cp feed-integrity.html _site/feed-integrity.html
          mkdir -p _site/data
          cp data/odds.json _site/data/odds.json
          cp data/games.json _site/data/games.json
          cp data/players.json _site/data/players.json
          cp data/history.json _site/data/history.json
          cp data/baseline.json _site/data/baseline.json
          cp data/evaluation.json _site/data/evaluation.json
          cp data/probability_evaluation.json _site/data/probability_evaluation.json
          cp data/matchups.json _site/data/matchups.json
          cp data/rosters.json _site/data/rosters.json
          cp data/roster_quality.json _site/data/roster_quality.json
          cp data/feed_integrity.json _site/data/feed_integrity.json
          cp data/market_audit.json _site/data/market_audit.json
          cp data/holdout.json _site/data/holdout.json
          cp data/opponent_evaluation.json _site/data/opponent_evaluation.json
          cp data/opponent_holdout.json _site/data/opponent_holdout.json
          cp data/opponent_rolling.json _site/data/opponent_rolling.json
          cp data/opponent_seasons.json _site/data/opponent_seasons.json
          cp data/research_status.json _site/data/research_status.json
          cp data/history_quality.json _site/data/history_quality.json
          cp 404.html _site/404.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify actual published Pages responses
        run: python3 scripts/check_live_pages.py "${{ steps.deployment.outputs.page_url }}"
