name: Test and deploy NFL Edge
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: read
concurrency:
  group: nfl-edge-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static release checks
        run: python3 scripts/check_release.py
      - name: Odds collector offline tests
        run: python3 -m unittest discover -s tests -p "test_*.py"
      - name: UI smoke tests
        run: node --test tests/*.test.cjs
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect FanDuel odds using server-side secret
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 scripts/fetch_odds.py
      - name: Collect free NFL scoreboard
        run: python3 scripts/fetch_games.py
      - name: Collect free NFL player box scores
        run: python3 scripts/fetch_players.py
      - name: Compute daily history cache key
        id: history_day
        run: echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Restore daily historical NFL sample
        id: history_cache
        uses: actions/cache@v4
        with:
          path: data/history.json
          key: nfl-history-v2-${{ steps.history_day.outputs.day }}
      - name: Collect historical NFL player results
        if: steps.history_cache.outputs.cache-hit != 'true'
        run: python3 scripts/fetch_history.py
      - name: Evaluate historical over-probability estimates
        run: python3 scripts/evaluate_probabilities.py
      - name: Evaluate out-of-time probability holdout
        run: python3 scripts/evaluate_holdout.py
      - name: Build descriptive historical yardage baseline
        run: python3 scripts/build_baseline.py
      - name: Evaluate chronological yardage baseline
        run: python3 scripts/evaluate_baseline.py
      - name: Pair historical players to upcoming NFL opponents
        run: python3 scripts/build_matchups.py
      - name: Audit experimental probabilities against current FanDuel lines
        run: python3 scripts/build_market_audit.py
      - name: Publish only approved static files
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp legacy-demo.html _site/legacy-demo.html
          cp workbench.html _site/workbench.html
          cp market.html _site/market.html
          cp odds.html _site/odds.html
          cp home-next.html _site/home-next.html
          cp players.html _site/players.html
          cp history.html _site/history.html
          cp compare.html _site/compare.html
          cp evaluation.html _site/evaluation.html
          cp probabilities.html _site/probabilities.html
          cp matchups.html _site/matchups.html
          cp market-audit.html _site/market-audit.html
          cp holdout.html _site/holdout.html
          mkdir -p _site/data
          cp data/odds.json _site/data/odds.json
          cp data/games.json _site/data/games.json
          cp data/players.json _site/data/players.json
          cp data/history.json _site/data/history.json
          cp data/baseline.json _site/data/baseline.json
          cp data/evaluation.json _site/data/evaluation.json
          cp data/probability_evaluation.json _site/data/probability_evaluation.json
          cp data/matchups.json _site/data/matchups.json
          cp data/market_audit.json _site/data/market_audit.json
          cp data/holdout.json _site/data/holdout.json
          cp 404.html _site/404.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
