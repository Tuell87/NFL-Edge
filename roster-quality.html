<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NFL Edge | Roster Feed Quality</title><style>:root{font-family:system-ui,sans-serif;color:#eaf4ff;background:#0b1220}body{margin:0}main{max-width:850px;margin:auto;padding:20px 16px 65px}a{color:#54e4b3}.card{background:#17283e;border:1px solid #38506a;border-radius:14px;padding:16px;margin:12px 0}.muted{color:#b3c4d5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.metric{font-size:25px;font-weight:700}h1{font-size:26px}</style></head><body><main><a href="./">← Game Day</a><h1>Roster Feed Quality</h1><p class="muted">Free ESPN team-roster snapshots and stable player-ID matching. <strong>A roster listing is not proof of game-day active status or injury clearance.</strong> No betting picks are enabled by these checks.</p><p id="status" role="status">Loading roster quality…</p><div id="metrics" class="grid"></div><div class="card"><h2>Limitations</h2><p id="limitations" class="muted"></p><p class="muted"><a href="./matchups.html">Review upcoming matchup identity checks</a></p></div></main><script>'use strict';const $=id=>document.getElementById(id);async function load(){try{const response=await fetch('./data/roster_quality.json',{cache:'no-store'});if(!response.ok)throw Error('unavailable');const d=await response.json();$('status').textContent='Roster coverage: '+d.status+(d.roster_checked_at?' · snapshot '+new Date(d.roster_checked_at).toLocaleString():'');const fields=[['Teams requested',d.teams_requested],['Teams with roster data',d.teams_with_listings],['Failed team requests',d.teams_fetch_failed],['Empty/unrecognized teams',d.teams_empty_or_unrecognized],['Unique ESPN athlete IDs',d.unique_athlete_ids],['Upcoming player-team pairs',d.upcoming_player_team_pairs],['Matchup rows listed',d.matchup_listed],['Matchup rows not found',d.matchup_not_found],['Matchup rows unavailable',d.matchup_unavailable]];for(const [label,value] of fields){const card=document.createElement('article');card.className='card';const number=document.createElement('div');number.className='metric';number.textContent=value??'Unknown';const name=document.createElement('div');name.className='muted';name.textContent=label;card.append(number,name);$('metrics').append(card)}$('limitations').textContent=d.limitations||'Roster listing cannot verify injury or active status.'}catch(e){$('status').textContent='Roster quality unavailable; player availability remains unverified.'}}load();</script></body></html>
