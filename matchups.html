<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>NFL Edge | Player Matchups</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#0b1220;color:#eaf4ff}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:auto;padding:16px 14px 65px}a{color:#55e5b3}h1{font-size:25px;margin:12px 0 6px}.muted{color:#b5c8db}.small{font-size:13px}.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin:14px 0}input,select{width:100%;min-width:0;background:#17283e;border:1px solid #48627b;color:#fff;border-radius:9px;padding:11px;font-size:15px}.result{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #30475f}.result strong{display:block;font-size:14px}.result span{display:block;font-size:12px;margin-top:3px}.result button{background:#1c594d;color:#fff;border:1px solid #438f79;min-height:44px;padding:8px 11px;border-radius:8px;white-space:nowrap}.detail{padding:11px;background:#1b3046;border-radius:9px;margin:7px 0 10px;font-size:13px;line-height:1.6}.detail p{margin:5px 0}.panel{background:#15263b;border:1px solid #38516a;border-radius:12px;padding:13px;margin:13px 0}.hint{color:#ffd399}@media(max-width:520px){.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}}

.pagination{display:flex;gap:8px;margin-top:12px}
.pagination[hidden]{display:none}
.pagination button{min-height:44px;padding:8px 12px;background:#17283e;color:inherit;border:1px solid #48627b;border-radius:8px}
.pagination button:disabled{opacity:.55}
:focus-visible{outline:2px solid #55e5b3;outline-offset:2px}
.search-picker{min-width:0}.search-picker [hidden]{display:none}.search-picker select{width:100%;min-height:44px;font-size:16px}
@media(max-width:520px){.toolbar .search-picker{grid-column:1/-1}}
</style><link rel="stylesheet" href="./mobile-navigation.css">
</head><body>
<nav class="mobile-sections" aria-label="Main site sections">
  <a href="./#games">Games</a>
  <a href="./#players" aria-current="true">Players</a>
  <a href="./#odds">Odds &amp; Tools</a>
  <a href="./#research">Research</a>
  <a href="./#project">Project</a>
</nav>
<main><nav><a href="./#players">← Players</a> · <a href="./#games">Games</a> · <a href="./history.html">History</a></nav><h1>Upcoming Player Matchups</h1><p class="muted small">Compact schedule-to-player research. Roster listing is not proof of game-day availability. <strong>Injury and active status are unverified; no betting picks.</strong></p>
<div class="toolbar"><div class="search-picker">
<label for="search-choice">Player or team</label>
<select id="search-choice" data-default-label="All players and teams">
  <option value="">All players and teams</option>
  <option value="custom">Custom search…</option>
</select>
<input id="search" type="search" aria-label="Custom search" placeholder="Player or team…" hidden>
</div><select id="market" aria-label="Filter stat market"><option value="">All markets</option></select><select id="quality" aria-label="Filter historical sample"><option value="">All samples</option><option value="sufficient_recent_sample">Recent sample</option><option value="limited_sample">Limited sample</option></select></div>
<p id="status" role="status" class="muted small">Loading…</p><div id="list"></div>
<div id="pagination" class="pagination" role="group" aria-label="Matchup results pages" hidden>
<button id="previous" type="button">Previous</button><button id="next" type="button">Next</button>
</div>
</main><script src="./search-choices.js"></script>
<script>'use strict';const $=id=>document.getElementById(id);const pageSize=20;let rows=[],page=0;function el(tag,cls,value){const n=document.createElement(tag);if(cls)n.className=cls;if(value!==undefined)n.textContent=String(value);return n;}
function render(){const root=$('list');root.replaceChildren();const q=$('search').value.trim().toLowerCase(),market=$('market').value,quality=$('quality').value;const filtered=rows.filter(r=>(!q||[r.player,r.team,r.opponent].some(v=>String(v||'').toLowerCase().includes(q)))&&(!market||r.market===market)&&(!quality||r.sample_quality===quality));const lastPage = Math.max(0, Math.ceil(filtered.length / pageSize) - 1);
page = Math.max(0, Math.min(lastPage, page));
const start = page * pageSize;
const visible = filtered.slice(start, start + pageSize);
$('pagination').hidden = !lastPage;
$('previous').disabled = page === 0;
$('next').disabled = page === lastPage;
$('status').textContent = visible.length
  ? `Showing ${start + 1}–${start + visible.length} of ${filtered.length} matching records`
  : rows.length ? 'No matching player records.' : 'No upcoming player matchups.';
for(const r of visible){const item=el('article','result'),left=el('div'),title=el('strong','',String(r.player||'Unknown')+' · '+String(r.market||'Unknown market')),subtitle=el('span','muted',String(r.team||'?')+' vs '+String(r.opponent||'?')+' · '+String(r.games_sampled??'?')+' past games'),btn=el('button','','Details'),details=el('div','detail');details.hidden=true;const wrapper=el('div');left.append(title,subtitle);btn.type='button';btn.setAttribute('aria-expanded','false');btn.setAttribute('aria-label','Toggle details for '+String(r.player||'player'));const lines=[['Team source', r.team_source==='espn_roster_snapshot'?'ESPN roster listing':'Latest historical box score'],['Roster listing',r.roster_listing==='listed'?'Listed by ESPN ID (not active verification)':r.roster_listing==='not_found_in_snapshot'?'Not found in snapshot':'Unavailable'],['Historical sample',String(r.sample_quality||'unknown').replaceAll('_',' ')],['Sample limitations',Array.isArray(r.sample_quality_reasons)?r.sample_quality_reasons.join(', ').replaceAll('_',' '):'Unknown'],['Readiness blockers',Array.isArray(r.readiness_blockers)?r.readiness_blockers.join(', ').replaceAll('_',' '):'Verification unavailable'],['Availability','Unverified · no prediction']];for(const [label,value] of lines)details.append(el('p','',label+': '+value));btn.addEventListener('click',()=>{details.hidden=!details.hidden;btn.setAttribute('aria-expanded',String(!details.hidden));btn.textContent=details.hidden?'Details':'Close';});item.append(left,btn);wrapper.append(item,details);root.append(wrapper);}}
async function load(){try{const res=await fetch('./data/matchups.json',{cache:'no-store'});if(!res.ok)throw Error('missing');const data=await res.json();rows=Array.isArray(data.matchups)?data.matchups:[];if ($('search-choice')) updateSearchChoices(rows, ["player","team","opponent"]);const market=$('market');for(const value of [...new Set(rows.map(r=>r.market).filter(Boolean))].sort()){const option=el('option','',value);option.value=value;market.append(option);}render();}catch(e){$('status').textContent='Matchup data unavailable';}}
for (const id of ['search', 'market', 'quality']) {
  $(id).addEventListener(id === 'search' ? 'input' : 'change', () => {
    page = 0;
    render();
  });
}
function changePage(step) {
  page += step;
  render();
  $('status').focus();
}
$('status').tabIndex = -1;
$('previous').addEventListener('click', () => changePage(-1));
$('next').addEventListener('click', () => changePage(1));
if ($('search-choice')) updateSearchChoices([], ["player","team","opponent"]);
load();</script></body></html>
