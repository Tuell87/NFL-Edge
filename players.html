<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>NFL Edge | Player Box Scores</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#0b1220;color:#eaf4ff}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:auto;padding:16px 14px 65px}a{color:#55e4b4}.muted{color:#b5c9db}.small{font-size:13px}h1{font-size:25px;margin:12px 0 7px}.panel{background:#15263b;border:1px solid #38516a;border-radius:12px;padding:13px;margin:12px 0}.filters{display:grid;grid-template-columns:2fr 1fr;gap:9px}input,select{background:#17283e;border:1px solid #4c6680;color:#fff;border-radius:9px;padding:11px;font-size:16px;width:100%;min-width:0}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #30475f;padding:11px 0}.item strong{font-size:14px}.item .muted{display:block;font-size:12px;margin-top:3px}.item button,.paging button{border:1px solid #4a8e7b;border-radius:8px;background:#1c594d;color:#fff;padding:9px 11px}.item button{white-space:nowrap}.details{background:#1b3046;border-radius:8px;padding:10px;margin:6px 0 10px;font-size:13px;line-height:1.7}.paging{display:flex;gap:12px;align-items:center;justify-content:center;margin:17px 0}.paging button:disabled{opacity:.4}.empty{padding:15px 0}

.section-nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;background:#0b1220}
.section-nav a{display:grid;place-items:center;min-height:44px;padding:4px;text-align:center;font-size:clamp(11px,3vw,14px);text-decoration:none;border-radius:7px}
.section-nav a[aria-current]{background:#1c594d;color:#fff}
.item button,.details button{min-height:44px}
.details button{display:block;margin-top:8px;border:1px solid #4a8e7b;border-radius:8px;background:#1c594d;color:#fff;padding:8px 12px}
@media(max-width:600px){
 main{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
 .section-nav{position:fixed;z-index:2;inset:auto 0 0;padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));border-top:1px solid #38516a}
}
.search-picker{min-width:0}.search-picker [hidden]{display:none}.search-picker select{width:100%;min-height:44px;font-size:16px}
@media(max-width:520px){.toolbar .search-picker{grid-column:1/-1}}
</style></head><body><main><nav class="section-nav" aria-label="Main site sections">
<a href="./#games">Games</a><a href="./#players" aria-current="true">Players</a>
<a href="./#odds">Odds &amp; Tools</a><a href="./#research">Research</a><a href="./#project">Project</a>
</nav><h1>Recent NFL Player Box Scores</h1><a href="./history.html">Historical player game logs</a><p class="muted small">Observed player statistics from completed games, not player forecasts. The snapshot covers a limited number of games, not an entire season.</p>
<section class="panel"><div class="filters"><div class="search-picker">
<label for="search-choice">Player or team</label>
<select id="search-choice" data-default-label="All players and teams">
  <option value="">All players and teams</option>
  <option value="custom">Custom search…</option>
</select>
<input id="search" type="search" aria-label="Custom search" placeholder="Player or team…" hidden>
</div><select id="category" aria-label="Filter stat category"><option value="">All categories</option></select></div><p id="status" role="status" class="muted small">Loading player data…</p><p id="checked" class="muted small"></p><details><summary class="small">Data coverage</summary><p id="coverage" class="muted small"></p></details></section>
<div id="players"></div><div class="paging"><button id="previous" type="button">Previous</button><span id="page-status" class="small muted" aria-live="polite"></span><button id="next" type="button">Next</button></div>
</main><script src="./search-choices.js"></script>
<script>'use strict';const $=id=>document.getElementById(id);let rows=[],page=0;const PAGE_SIZE=25;function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=String(text);return n;}
function render(){const root=$('players');root.replaceChildren();const q=$('search').value.trim().toLowerCase(),cat=$('category').value;const filtered=rows.filter(r=>(!cat||r.category===cat)&&[r.player,r.team].some(s=>String(s||'').toLowerCase().includes(q)));const pages=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));page=Math.min(page,pages-1);$('page-status').textContent=filtered.length?'Page '+(page+1)+' of '+pages+' · '+filtered.length+' results':'No matching records';$('previous').disabled=page===0;$('next').disabled=page>=pages-1;if(!filtered.length){root.append(el('p','muted empty','No matching box scores.'));return;}for(const r of filtered.slice(page*PAGE_SIZE,(page+1)*PAGE_SIZE)){const wrapper=el('div'),item=el('article','item'),left=el('div'),name=el('strong','',r.player||'Unknown player'),sub=el('span','muted',[r.team,r.game,r.category].filter(Boolean).join(' · ')),btn=el('button','','Stats'),details=el('div','details');details.hidden=true;for(const [key,value] of Object.entries(r.stats||{}))details.append(el('span','',key+': '+value+' · '));left.append(name,sub);btn.type='button';btn.setAttribute('aria-expanded','false');btn.setAttribute('aria-label','Toggle stats for '+String(r.player||'player'));const back=el('button','','Back to player results');
back.type='button';
details.append(back);
function setStatsOpen(open){
  details.hidden=!open;
  btn.setAttribute('aria-expanded',String(open));
  btn.textContent=open?'Close':'Stats';
}
btn.addEventListener('click',()=>setStatsOpen(details.hidden));
back.addEventListener('click',()=>{
  setStatsOpen(false);
  btn.focus();
});item.append(left,btn);wrapper.append(item,details);root.append(wrapper);}}
async function load(){try{const res=await fetch('./data/players.json',{cache:'no-store'});if(!res.ok)throw Error('unavailable');const data=await res.json();rows=Array.isArray(data.players)?data.players:[];if ($('search-choice')) updateSearchChoices(rows, ["player","team"]);$('status').textContent=data.status==='ok'?rows.length+' box-score rows loaded':data.status==='no_stats'?'No completed game box scores in this snapshot.':'Player stats unavailable. Please try again later.';$('checked').textContent=data.checked_at?'Checked: '+new Date(data.checked_at).toLocaleString():'';$('coverage').textContent='Complete game summaries: '+(data.games_with_stats??'Unknown')+' · Attempts: '+(data.games_checked??'Unknown')+' · Failed/empty: '+(data.summary_failures_or_empty??'Unknown')+' · Row limit: '+(data.player_row_limit_reached?'reached':'not reached');for(const name of [...new Set(rows.map(r=>r.category).filter(Boolean))].sort()){const option=el('option','',name);option.value=name;$('category').append(option);}render();}catch(e){$('status').textContent='Player stats feed unavailable.';}}
for(const id of ['search','category'])$(id).addEventListener(id==='search'?'input':'change',()=>{page=0;render();});$('previous').addEventListener('click',()=>{if(page>0){page--;render();}});$('next').addEventListener('click',()=>{page++;render();});if ($('search-choice')) updateSearchChoices([], ["player","team"]);
load();</script></body></html>
